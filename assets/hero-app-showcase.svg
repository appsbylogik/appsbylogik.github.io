<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">AppsByLogik app showcase phones</title><desc id="desc">Two modern phone mockups showing dashboard-style app screens.</desc>
