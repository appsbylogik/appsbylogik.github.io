<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrailFit Email Verified</title>
  <style>
    :root {
      --bg: #06100d;
      --card: #101b19;
      --border: #263936;
      --green: #78c423;
      --orange: #ff8a00;
      --text: #f5f7f2;
      --muted: #c7d0ca;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(5, 12, 10, 0.78), rgba(5, 12, 10, 0.94)),
        radial-gradient(circle at top, #1a4124, var(--bg) 68%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 540px);
      background: rgba(16, 27, 25, 0.96);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 34px 28px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 180px;
      max-width: 70%;
      margin: 0 auto 18px;
      display: block;
    }

    .badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--green);
      color: #07100d;
      display: grid;
      place-items: center;
      font-size: 38px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      margin-top: 26px;
      padding: 15px 24px;
      border-radius: 14px;
      background: var(--green);
      color: #07100d;
      font-weight: 900;
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .button:hover {
      filter: brightness(1.08);
    }

    .small {
      margin-top: 18px;
      color: #95a39d;
      font-size: 14px;
    }

    .brand {
      margin-top: 26px;
      color: var(--orange);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/trailfit_logo.png" alt="TrailFit logo" />

    <div class="badge">✓</div>

    <h1>Email Verified</h1>

    <p>Your TrailFit account is ready. You can return to the TrailFit app and sign in.</p>

   <a class="button" href="trailfit://verified">Go Back to TrailFit</a>

    <p class="small">
      If the button does not open the app, close this browser tab and open TrailFit manually.
    </p>

    <div class="brand">Stronger rides. Better you.</div>
  </main>

  <script>
    document.querySelector(".button").addEventListener("click", function () {
      setTimeout(function () {
        document.querySelector(".small").textContent =
          "If TrailFit did not open, close this browser tab and open the app manually.";
      }, 1200);
    });
  </script>
</body>
</html>
